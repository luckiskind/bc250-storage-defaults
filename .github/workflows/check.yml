name: Check storage package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and isolated safety tests
        run: |
          python3 -m compileall -q install.py install_transaction.py storage_defaults_power.py storage_defaults_repack.py make_patch.py tests tools bench analysis
          sh -n apply.sh undo.sh status.sh systemd/90-bc250-nvme-power
          python3 -m unittest discover -s tests -v
      - name: Build the read-only aligned fixture worker
        run: |
          cc -O2 -Wall -Wextra -Werror -pthread bench/direct_probe.c -o /tmp/bc250-direct-probe
          if /tmp/bc250-direct-probe; then exit 1; else test "$?" -eq 2; fi
      - name: Build private native-input helpers
        run: |
          cc -O2 -Wall -Wextra -Werror -shared -fPIC bench/native_input_mount.c -o /tmp/bc250-native-mount.so
          cc -O2 -Wall -Wextra -Werror bench/native_input_utmp.c -o /tmp/bc250-native-utmp
          if /tmp/bc250-native-utmp; then exit 1; else test "$?" -eq 2; fi
      - name: Verify exported patch applies to an empty repository
        run: |
          python3 make_patch.py /tmp/bc250-storage.patch
          mkdir /tmp/patch-target
          git -C /tmp/patch-target init -q
          git -C /tmp/patch-target apply --check /tmp/bc250-storage.patch
          git -C /tmp/patch-target apply /tmp/bc250-storage.patch
          test -f /tmp/patch-target/bc250-storage-defaults/apply.sh
