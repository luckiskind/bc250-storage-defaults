<!doctype html>
<html lang="en"><meta charset="utf-8"><title>BC-250 private workload</title>
<style>
body{background:#172338;color:#eef5ff;font:20px system-ui;margin:5vh auto;max-width:900px;padding:24px}
img{display:block;width:720px;max-width:95%;height:auto;border:2px solid #7dc9bc}
button{font:inherit;padding:12px 24px;margin-top:20px} output{padding:20px;color:#7dc9bc}
</style>
<h1>BC-250 browser endpoint control</h1>
<p>This private local document tests application readiness.</p>
<img src="image.svg" width="720" height="320" alt="Deterministic readiness pattern">
<button id="control">Run scripted interaction</button><output id="status">Waiting</output>
<script>
const token=location.pathname.split('/')[1];
let clicks=0;
document.querySelector('#control').addEventListener('click',()=>{
  clicks++;document.querySelector('#status').textContent='Ready '+clicks;
});
const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
async function main(){
  if(document.readyState!=='complete')await new Promise(resolve=>addEventListener('load',resolve,{once:true}));
  const image=document.querySelector('img');await image.decode();await document.fonts.ready;
  while(document.visibilityState!=='visible')await new Promise(resolve=>addEventListener('visibilitychange',resolve,{once:true}));
  document.querySelector('#control').click();
  const first=await frame(),second=await frame();
  const body={nonce:token,document_complete:document.readyState==='complete',
    visibility:document.visibilityState,image_decoded:image.complete&&image.naturalWidth===720,
    fonts_loaded:document.fonts.status==='loaded',scripted_clicks:clicks,
    status_text:document.querySelector('#status').textContent,frames_waited:2,
    distinct_frame_timestamps:second>first,inner_width:innerWidth,inner_height:innerHeight,
    page_elapsed_ms:performance.now()};
  await fetch('/'+token+'/ready',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}
main().catch(async error=>{await fetch('/'+token+'/error',{method:'POST',body:String(error.name).slice(0,80)});});
</script></html>
